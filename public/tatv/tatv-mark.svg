<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">तत्व · Tatv AI — तीन रेखाएँ, एक बिंदु</title>
  <defs>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="24" y1="24" x2="216" y2="216">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#ff4a2e"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="216" y1="24" x2="24" y2="216">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset=".55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffd36b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2=".5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset=".5" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff8a00"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to=".5 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bindu">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".45" stop-color="#ff5a2e"/>
      <stop offset="1" stop-color="#d11f1f"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .ring{transform-box:view-box;transform-origin:120px 120px;fill:none;stroke-linecap:round}
      .a{animation:spin 9s linear infinite}
      .b{animation:spin 14s linear infinite reverse}
      .glow{opacity:.2;filter:url(#blur)}
      .awake .a{animation-duration:2.2s}
      .awake .b{animation-duration:3.4s}
      @keyframes spin{to{transform:rotate(360deg)}}
      .line{fill:none;stroke:url(#flow);stroke-width:9;stroke-linecap:round;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) both}
      .l2{animation-delay:.25s}
      .l3{animation-delay:.5s}
      @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
      .dot,.halo{transform-box:fill-box;transform-origin:center}
      .dot{animation:pop .6s 1s cubic-bezier(.3,1.6,.5,1) both}
      .halo{fill:#ff4a2e;animation:pulse 2.8s 1.6s ease-out infinite;opacity:0}
      .awake .halo{animation-duration:1.1s}
      @keyframes pop{from{transform:scale(0)}}
      @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <circle class="ring glow a" cx="120" cy="120" r="96" stroke="url(#g1)" stroke-width="6" stroke-dasharray="330 273"/>
  <circle class="ring a" cx="120" cy="120" r="96" stroke="url(#g1)" stroke-width="4" stroke-dasharray="330 273"/>
  <circle class="ring glow b" cx="120" cy="120" r="96" stroke="url(#g2)" stroke-width="6" stroke-dasharray="190 413"/>
  <circle class="ring b" cx="120" cy="120" r="96" stroke="url(#g2)" stroke-width="4" stroke-dasharray="190 413"/>
  <circle cx="120" cy="120" r="84" fill="none" stroke="#6b5f82" stroke-opacity=".18" stroke-width="1"/>
  <path class="line" pathLength="1" stroke-dasharray="1" d="M74 86 Q120 72 166 86"/>
  <path class="line l2" pathLength="1" stroke-dasharray="1" d="M74 106 Q120 92 166 106"/>
  <path class="line l3" pathLength="1" stroke-dasharray="1" d="M74 126 Q120 112 166 126"/>
  <circle class="halo" cx="120" cy="152" r="8"/>
  <circle class="dot" cx="120" cy="152" r="8" fill="url(#bindu)"/>
</svg>