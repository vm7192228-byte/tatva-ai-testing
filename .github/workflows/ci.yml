name: Testing CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run routing, provider and quota regression tests
        run: |
          bun run vitest run \
            src/test/chat-api-freellmapi.test.ts \
            src/test/chat-failover.test.ts \
            src/test/chat-smart-dual-gateway.test.ts \
            src/test/chat-api-providers.test.ts \
            src/test/chat-provider-adapters.test.ts \
            src/test/chat-api-file-quota.test.ts \
            src/test/chat-quota-reservations.test.ts \
            src/test/media-api-quota-reservations.test.ts \
            src/test/usage-limits-reservations.test.ts

      - name: Run ESLint
        run: bun run lint

      - name: Build production application
        run: bun run build
